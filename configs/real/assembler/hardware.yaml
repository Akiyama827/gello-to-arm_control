# Assembler arm — HARDWARE IDENTITY.
#
# Lifetime: changes when the ARM ITSELF changes (a module added or removed, a
# motor swapped, the CAN adapter replaced). Nothing in this file is a bench
# session knob and nothing here is written by a calibration script.
#
# Motor assignment (CAN IDs 0x01–0x07):
#   0x01  DM4340P  Joint1  (high-torque, cross-roller bearing)
#   0x02  DM4340   Joint2
#   0x03  DM4340   Joint3
#   0x04  DM4310   Joint4
#   0x05  DM4310   Joint5
#   0x06  DM4310   Joint6
#   0x07  DM4310   Gripper  (drives Gripper_1/Gripper_2 prismatic joints)
#
# Flash the gsusb firmware, then bring up the interface before launching:
#   sudo ip link set dmcan type can bitrate 1000000 dbitrate 5000000 fd on
#   sudo ip link set dmcan up

real_backend: dmcan
listen_mode: true

# Canonical per-arm identity. Every node reads THIS block (nodes fall back to
# the historical flat `assembler_*` keys only for un-migrated configs).
arm:
  joints: [Joint1, Joint2, Joint3, Joint4, Joint5, Joint6]
  gripper_joints: [Gripper_1, Gripper_2]
  ee_frame: Link6
  # world_origin / world_rpy live in calibration.yaml — they are MEASURED.

# Fallback DM SDK settings (used when real_backend starts with "dm_")
bus:
  adapter: USB2FDCAN
  device_type: USB2CANFD
  device_index: 0
  channel: 0
  canfd: true
  can_baudrate: 1000000
  canfd_baudrate: 5000000
  can_sp: 0.75
  canfd_sp: 0.75
  brs: true
  extended_id: false
  remote_frame: false

num_motors: 7
motor_ids: [1, 2, 3, 4, 5, 6, 7]
motor_names:
  - Joint1
  - Joint2
  - Joint3
  - Joint4
  - Joint5
  - Joint6
  - Gripper
joint_names:
  - Joint1
  - Joint2
  - Joint3
  - Joint4
  - Joint5
  - Joint6
  - Gripper

render_joint_names:
  - Joint1
  - Joint2
  - Joint3
  - Joint4
  - Joint5
  - Joint6
  - Gripper_1
  - Gripper_2

motors:
  - name: Joint1
    joint: Joint1
    can_id: 1
    motor_type: "4340p"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Joint2
    joint: Joint2
    can_id: 2
    motor_type: "4340"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Joint3
    joint: Joint3
    can_id: 3
    motor_type: "4340"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Joint4
    joint: Joint4
    can_id: 4
    motor_type: "4310"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Joint5
    joint: Joint5
    can_id: 5
    motor_type: "4310"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Joint6
    joint: Joint6
    can_id: 6
    motor_type: "4310"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false
  - name: Gripper
    joint: Gripper
    can_id: 7
    motor_type: "4310"
    master_id: null
    module: assembler
    bank: null
    enabled_on_open: false

banks: []
modules:
  - name: assembler
    bank: null
    motor_names: [Joint1, Joint2, Joint3, Joint4, Joint5, Joint6, Gripper]

# Gripper motor <-> finger metres map. The ENDPOINTS are mechanical (the motor
# travel between hard stops), so they live here; the grasp thresholds measured
# against them are in calibration.yaml.
joint_mimics:
  Gripper_1: {source: Gripper, motor_open: 0.0, motor_closed: -4.985, lower: 0.0, upper: 0.0439}
  Gripper_2: {source: Gripper, motor_open: 0.0, motor_closed: -4.985, lower: 0.0, upper: 0.0439}

# Software safety layer (hardware bridge). All values are BENCH-TUNABLE; the
# defaults are conservative and motor-datasheet-bounded — the torque clamp stays
# under the DM MIT encode peak (4340/4340P ±28 N·m, 4310 ±10 N·m).
safety:
  deadman_timeout_s: 0.1        # armed + no motor_command within this → safe-stop + latch disarm
  temp_limit_c: 85.0            # T_mos or T_rotor over this (°C) → fault reflex safe-stop
  arm_ramp_sec: 1.0             # soft-start: scale kp/kd/tau_ff 0→1 after arm (no engage twitch)
  # Per-joint feed-forward torque clamp (N·m), joint order matches `motors` above
  # (Joint1..Joint6, Gripper). Bounds tau_ff before encode, independent of the
  # DM firmware clamp. Omit to fall back to per-motor-type defaults.
  # NOTE — GRIPPER GRIP FORCE IS NOT GOVERNED BY torque_limits[Gripper]=3.0. That
  # only clamps the feed-forward tau_ff. The grasp HOLD squeeze is close_kp *
  # position_error (see `grasp.close_kp` in calibration.yaml), bounded only by the
  # DM firmware's own torque clamp (~±10 N·m for the DM4310 gripper motor).
  # Lowering this value does NOT reduce grip force — retune `close_kp` instead.
  torque_limits: [9.0, 9.0, 9.0, 3.0, 3.0, 3.0, 3.0]

urdf_path: "assembler/Assembler/urdf/Assembler.urdf"
update_rate_hz: 400
hardware_update_rate_hz: 400
viz_publish_rate_hz: 60
rerun_fk_rate_hz: 30
rerun_plot_window_s: 10.0
viz_log_rates: false
rerun_app_id: arm_control_real_assembler

motor_log_path: /tmp/assembler_gripper_motor_log.csv

# ---------------------------------------------------------------------------
# Camera rig identity + registration pipeline tuning (nodes/perception.py, one
# node per camera via CAM_ROLE). The MEASURED extrinsics that pair with these
# live in calibration.yaml — that is the only part a calibration run rewrites.
# ---------------------------------------------------------------------------
perception:
  static:                      # Gemini 336L — overview, PRIMARY geometry source
    serial: ""                 # empty = first Orbbec found; set on rung 9
    rate_hz: 2.0
  wrist:                       # Gemini 305 — calibration + pregrasp re-verify
    serial: ""
    rate_hz: 5.0
  # module_meshes + tags (which modules exist, their CAD, their end-cap ArUco
  # ids) are TASK data, declared in scenario.yaml — this file describes only
  # the camera rig and the registration pipeline's tuning.
  voxel_m: 0.004
  plane_dist_m: 0.008
  cluster_eps_m: 0.02
  cluster_min_points: 80
  icp_dist_m: 0.01
  min_fitness: 0.6             # ICP fitness gate; poses below are withheld
  # Modules are presented standing upright: reject registration fits whose
  # z-axis tilts more than this from world +z (near-symmetric CAD lets
  # RANSAC land flipped with competitive fitness — first seen in the sim
  # shadow run). Disable for arbitrary-pose picking.
  upright_axis_tol_deg: 30
  # Which fitted-mesh axis the presentation pins, and where it points in the
  # WORLD frame. For row_motor.stl with the module passive-end-up, the mesh's
  # module-axis is local +y and points DOWN (the motor body is flipped inside
  # the module). RE-DERIVE at rung 10 if the registration mesh changes — the
  # pair is mesh-frame specific.
  upright_local_axis: [0.0, 1.0, 0.0]
  upright_world_axis: [0.0, 0.0, -1.0]
  stale_s: 2.0                 # consumers reject module_poses older than this
  board:                       # ChArUco plate bolted flat to the table
    squares_x: 5
    squares_y: 7
    square_m: 0.03
    marker_m: 0.022
    dict: DICT_5X5_100
