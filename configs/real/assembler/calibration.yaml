# Assembler arm — MEASURED VALUES.
#
# Lifetime: rewritten by a calibration run, not by hand and not per session.
# Everything here has a measurement procedure attached (the bring-up ladder rung
# is named on each key). Keeping it in its own file is the point: a bench
# session's scenario edits can never collide with calibration output, and
# `git diff` on this file is exactly "what did the last calibration change".
#
# Writers:
#   scripts/calibrate_hand_eye.py wrist   -> arm.world_*, perception.wrist.*
#   scripts/calibrate_hand_eye.py static  -> perception.static.world_T_cam
#   scripts/bench_ramp.py --write-rung N  -> arm.kp / arm.kd

# --- Arm mount (rung 6 / rung 9) -------------------------------------------
# The arm BASE pose in the world(=ChArUco board) frame. The coordinator maps the
# world-frame waypoints through this to arm-frame IK targets, and perception
# uses it to convert its world-frame output into this arm's base.
# PLACEHOLDER identity (arm base == board origin); replaced by
# `calibrate_hand_eye.py wrist`, which prints this exact block.
arm:
  world_origin: [0.0, 0.0, 0.0]
  world_rpy:    [0.0, 0.0, 0.0]

  # --- Gain table (rung 4) --------------------------------------------------
  # ONE gain table shared by Isaac + the DM bridge (design "Gain contract").
  # START = rung-1 bench values kp=20 / kd=0.5 (user-tested per motor). These
  # are ~30x softer than the sim-validated 600/60, which the DM MIT wire format
  # CANNOT carry (kp<=500, kd<=5 — pack_mit_control_frame would reject/clip).
  # RUNG 4 (scripts/bench_ramp.py) climbs the table upward from here and
  # rewrites these two lines in place.
  kp: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]   # RUNG 4 start — DM range kp<=500
  kd: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]         # RUNG 4 start — DM range kd<=5

# --- Camera extrinsics (rung 9) --------------------------------------------
perception:
  static:
    # world_T_cam: 4x4 row-major — printed by `calibrate_hand_eye.py static`.
    # Direct board observation: independent of the arm, survives reassembly.
    {}
  wrist:
    # ee_T_cam / base_T_board — printed by `calibrate_hand_eye.py wrist`.
    # RE-RUN after EVERY distal-stack change (AX=XB is invalidated).
    {}
  tags:
    size_m: 0.028              # PLACEHOLDER rung 10 — printed tag side (m), measure
    mount_yaw_rad: 0.0         # PLACEHOLDER rung 10 — tag x-axis vs module key datum
  # Workspace AABB in the WORLD (board) frame (m) — the PICK ZONE crop.
  # Numerically unchanged from the pre-re-rooting arm-base box because this
  # bench mounts the board AT the arm base (arm.world_* above are zero);
  # re-derive from the board grid at rung 9 once the plate offset is measured.
  crop_min: [0.05, -0.60, -0.02]
  crop_max: [0.90,  0.60,  0.40]

# --- Gripper grasp gate (rungs 7 + 11) --------------------------------------
# Torque-threshold gripper grasp gate (produces grasp_result on hardware). Open
# endpoints/clamp range come from `joint_mimics.Gripper_1` in hardware.yaml;
# only the values below are grasp-specific and measured.
#
# GRIP-FORCE AUTHORITY: the hold squeeze is `close_kp * position_error`, plus any
# `hold_torque` feed-forward bias, bounded ONLY by the DM firmware torque clamp
# (~±10 N·m on the DM4310 gripper motor) — NOT by `safety.torque_limits[Gripper]`,
# which caps only tau_ff (hold_torque), not the kp-driven component. To change grip
# force, retune `close_kp` (and `hold_torque`); lowering the safety limit will not.
grasp:
  grip_torque_thresh: 1.5     # N·m, |torque_est| over this before empty-closed = object grasped
  empty_closed_motor: -4.8    # gripper MOTOR rad reached when closing on air (nearer close than any object)
  close_kp: 40.0              # closing/hold position gain (within DM 4310 range ≤500)
  close_kd: 2.0               # closing/hold damping gain (within DM 4310 range ≤5)
  hold_torque: 0.0            # N·m closing bias held through the lift (0 = kp squeeze only)
  close_step_rad: 0.05        # per-tick closing ramp increment toward motor_closed
  # τ→F map: N of finger grip per N·m of motor torque, bench-calibrated at
  # RUNG 11 (squeeze a kitchen scale / load cell at ~3 torque levels, fit
  # linear). Once set, thresholds can be stated in Newtons instead:
  # grip_force_per_torque: 25.0   # PLACEHOLDER rung 11 — uncomment when measured
  # grip_force_thresh_n: 6.0      # replaces grip_torque_thresh (needs map above)

# --- Workcell geometry (rung 9) ---------------------------------------------
# Static workcell obstacles, ARM-BASE frame (the planner's world). Each box:
# size [sx, sy, sz] (m), pose [x, y, z, roll, pitch, yaw] of the box CENTER.
# The planner checks every robot body against these at zero padding. Table top
# z is a tape-rule PLACEHOLDER; the ChArUco board calibration refines it.
environment:
  - name: table
    size: [1.2, 0.8, 0.05]
    pose: [0.45, 0.0, -0.025, 0.0, 0.0, 0.0]   # top face at z=0 PLACEHOLDER
