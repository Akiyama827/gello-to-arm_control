<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>arm teleop</title>
<style>
 body{margin:0;font-family:sans-serif;display:flex;height:100vh;overflow:hidden}
 #view{flex:1;position:relative;min-width:0}
 #panel{width:21em;padding:1em;overflow-y:auto;background:#f4f4f4;box-sizing:border-box}
 h3{margin:.2em 0 .5em}h4{margin:.9em 0 .2em;color:#555}
 .hint{color:#777;font-size:.8em;line-height:1.35}
 .row{display:flex;align-items:center;gap:.6em;margin:.35em 0}
 .row label{width:4.5em;font-size:.9em}
 .row output{width:4.5em;text-align:right;font-family:monospace;font-size:.9em}
 input[type=range]{flex:1;min-width:0}
 button{margin:.25em .3em .25em 0;padding:.45em .8em}
 #debug{display:none}
 #log{font-family:monospace;font-size:.8em;white-space:pre-wrap;color:#333;margin-top:.8em}
</style>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
 <h3>arm teleop</h3>
 <div id="gate" style="display:none;margin:.3em 0 .6em">
  <span id="gatebadge" style="display:inline-block;padding:.35em .8em;border-radius:5px;
        font-weight:bold;color:#fff;background:#888">&hellip;</span>
  <button id="arm-btn" style="background:#e8f5e9">ARM</button>
  <button id="disarm-btn" style="background:#c62828;color:#fff;font-weight:bold">DISARM</button>
 </div>
 <div class="hint">Drag ONE gizmo handle at a time on the end effector —
  arrows move, rings rotate (buttons below switch). Colors: real STL =
  measured arm, <b style="color:#e08000">orange</b> = your target,
  <b style="color:#2ca02c">green</b> = planned motion playback.</div>
 <div>
  <button id="mode-t">translate</button>
  <button id="mode-r">rotate</button>
 </div>
 <div id="buttons"></div>
 <h4>gripper (m)</h4><div id="grip"></div>
 <h4><button id="dbg">debug: joint sliders</button></h4>
 <div id="debug"></div>
 <div id="log"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';

const view = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x24242a);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 20);
camera.up.set(0, 0, 1);                    // robot base frame is Z-up
camera.position.set(0.9, -0.9, 0.6);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
function resize(){
 const w = view.clientWidth, h = view.clientHeight;
 renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.4);
dl.position.set(1, -1, 2); scene.add(dl);
const grid = new THREE.GridHelper(2, 20, 0x666666, 0x3a3a3a);
grid.rotation.x = Math.PI / 2; scene.add(grid);   // GridHelper is XZ; lay into XY
scene.add(new THREE.AxesHelper(0.15));

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0, 0.15);

// ---------- robots: one mesh group per role, posed from server FK ----------
const loader = new STLLoader();
const geomCache = {};
function loadGeom(url){
 // The error callback is load-bearing: three.js calls onError on a failed load,
 // and with no handler the promise NEVER settles — build() then hangs forever
 // with no console output, so the whole sidebar (sliders, gripper, buttons)
 // silently never gets created. Surface it and keep going with empty geometry:
 // a missing link is obvious on screen, an empty panel is not.
 if (!geomCache[url])
  geomCache[url] = new Promise(res => loader.load(url, res, undefined, err => {
   console.error('mesh load failed:', url, err);
   res(new THREE.BufferGeometry());
  }));
 return geomCache[url];
}
async function buildRobot(geoms, tint, opacity){
 const group = new THREE.Group(); const parts = [];
 for (const g of geoms){
  const geo = await loadGeom(g.mesh);
  const color = tint ? new THREE.Color(tint)
                     : new THREE.Color(g.color[0], g.color[1], g.color[2]);
  const mat = new THREE.MeshPhongMaterial(
   {color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(g.scale[0], g.scale[1], g.scale[2]);
  group.add(mesh); parts.push(mesh);
 }
 group.visible = false; scene.add(group);
 return {group, parts};
}
function setPoses(robot, poses){
 if (!robot) return;              // poll() runs before build() finishes
 if (!poses){ robot.group.visible = false; return; }
 robot.group.visible = true;
 poses.forEach((t, i) => {
  robot.parts[i].position.set(t.p[0], t.p[1], t.p[2]);
  robot.parts[i].quaternion.set(t.q[0], t.q[1], t.q[2], t.q[3]);
 });
}

// ---------- EE gizmo: single-axis drags -> POST cart ----------
const dummy = new THREE.Object3D(); scene.add(dummy);
const tc = new TransformControls(camera, renderer.domElement);
tc.attach(dummy); tc.setSpace('world'); tc.setSize(0.6); scene.add(tc);
let dragging3d = false;
const prevQ = new THREE.Quaternion();
let rotAccum = 0, lastSend = 0;
tc.addEventListener('dragging-changed', e => {
 orbit.enabled = !e.value; dragging3d = e.value;
 if (e.value){ prevQ.copy(dummy.quaternion); rotAccum = 0; }
});
tc.addEventListener('objectChange', () => {
 const ax = tc.axis;
 if (!['X', 'Y', 'Z'].includes(ax)) return;   // single-axis handles only
 const i = {X: 0, Y: 1, Z: 2}[ax];
 const now = performance.now();
 if (tc.mode === 'translate'){
  if (now - lastSend < 50) return;
  lastSend = now;
  fetch('cart', {method: 'POST', body: JSON.stringify(
   {axis: i, value: dummy.position.getComponent(i)})});
 } else {
  // signed angle of the increment about the dragged world axis
  const qd = dummy.quaternion.clone().multiply(prevQ.clone().invert());
  prevQ.copy(dummy.quaternion);
  const v = new THREE.Vector3(qd.x, qd.y, qd.z);
  if (v.length() < 1e-9) return;
  let ang = 2 * Math.atan2(v.length(), qd.w);
  if (ang > Math.PI) ang -= 2 * Math.PI;
  rotAccum += ang * Math.sign(v.getComponent(i));
  if (now - lastSend < 50 || Math.abs(rotAccum) < 1e-4) return;
  lastSend = now;
  fetch('cart', {method: 'POST', body: JSON.stringify(
   {axis: 3 + i, delta: rotAccum})});
  rotAccum = 0;
 }
});
document.getElementById('mode-t').onclick = () => tc.setMode('translate');
document.getElementById('mode-r').onclick = () => tc.setMode('rotate');

// ---------- panel widgets ----------
let sliderDrag = false;
function row(parent, d, dec, oninput){
 const r = document.createElement('div'); r.className = 'row';
 r.innerHTML = `<label>${d.name}</label>
  <input type="range" min="${d.min}" max="${d.max}" step="${d.step || 0.01}" value="${d.value}">
  <output>${d.value.toFixed(dec)}</output>`;
 parent.appendChild(r);
 const el = r.querySelector('input'), out = r.querySelector('output');
 el.oninput = () => { out.value = (+el.value).toFixed(dec); oninput(+el.value); };
 el.onpointerdown = () => sliderDrag = true;
 el.onpointerup = () => sliderDrag = false;
 return [el, out];
}
function sync(pairs, rows, dec){
 rows.forEach((d, i) => {
  const [el, out] = pairs[i];
  if (Math.abs(+el.value - d.value) > 1e-4){
   el.value = d.value; out.value = d.value.toFixed(dec);
  }
 });
}
document.getElementById('dbg').onclick = () => {
 const d = document.getElementById('debug');
 d.style.display = d.style.display === 'block' ? 'none' : 'block';
};

// ---------- wiring ----------
let built = false, building = false, joints = [], grip = null;
let measured = null, target = null, planBot = null;
let planFrames = [], planVersion = -1, planIdx = 0;

async function build(s){
 // `building` guards re-entry while the awaits below run; `built` flips only
 // once the sliders/buttons actually EXIST. Setting built=true up front let the
 // 150 ms poll take the sync() branch against an empty `joints`, throwing
 // "undefined is not iterable" on every tick — dozens of red herrings in the
 // console that hid the real (silent) mesh hang.
 building = true;
 const sc = await (await fetch('scene')).json();
 measured = await buildRobot(sc.geoms, null, 1.0);          // real STL colors
 target   = await buildRobot(sc.geoms, 0xe08000, 0.45);     // orange = target
 planBot  = await buildRobot(sc.geoms, 0x2ca02c, 0.55);     // green = plan
 joints = s.sliders.map(d => row(document.getElementById('debug'), d, 2, () => {
  const values = joints.map(([el]) => +el.value);
  fetch('sliders', {method: 'POST', body: JSON.stringify({values})});
 }));
 grip = row(document.getElementById('grip'), s.gripper, 3,
  v => fetch('gripper', {method: 'POST', body: JSON.stringify({value: v})}));
 const bd = document.getElementById('buttons');
 s.buttons.forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => fetch('click', {method: 'POST', body: JSON.stringify({button: name})});
  bd.appendChild(b);
 });
 built = true;
 resize();
}

async function poll(){
 let s;
 try { s = await (await fetch('state')).json(); } catch { return; }
 if (!built && !building){ await build(s); }
 else if (built && !sliderDrag){ sync(joints, s.sliders, 2); sync([grip], [s.gripper], 3); }
 setPoses(measured, s.measured_geoms);
 setPoses(target, s.target_geoms);
 if (!dragging3d && s.ee){
  dummy.position.set(s.ee.p[0], s.ee.p[1], s.ee.p[2]);
  dummy.quaternion.set(s.ee.q[0], s.ee.q[1], s.ee.q[2], s.ee.q[3]);
 }
 if (s.plan_version !== planVersion){
  planVersion = s.plan_version;
  const p = await (await fetch('plan')).json();
  planFrames = p.frames || []; planIdx = 0;
  if (!planFrames.length && planBot) planBot.group.visible = false;
 }
 document.getElementById('log').textContent = s.log.join('\n');
 // Operator gate: only shown when the graph wires motor_health (real arms).
 const gate = document.getElementById('gate');
 if (s.armed === null || s.armed === undefined){ gate.style.display = 'none'; }
 else {
  gate.style.display = 'block';
  const badge = document.getElementById('gatebadge');
  if (s.fault){  // latched server keeps ARMED set — fault wins the badge
   badge.textContent = 'FAULTED';
   badge.style.background = '#e65100';
   badge.title = s.fault + ' — DISARM then ARM to recover';
  } else {
   badge.textContent = s.armed ? 'ARMED' : 'DISARMED';
   badge.style.background = s.armed ? '#2ca02c' : '#c62828';
   badge.title = '';
  }
 }
}
setInterval(poll, 150); poll();
for (const name of ['ARM', 'DISARM']){
 document.getElementById(name.toLowerCase() + '-btn').onclick =
  () => fetch('click', {method: 'POST', body: JSON.stringify({button: name})});
}

setInterval(() => {                       // green ghost playback loop
 if (planBot && planFrames.length){
  setPoses(planBot, planFrames[planIdx]);
  planIdx = (planIdx + 1) % planFrames.length;
 }
}, 100);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene, camera);
}
resize(); animate();
</script>
</body>
</html>
