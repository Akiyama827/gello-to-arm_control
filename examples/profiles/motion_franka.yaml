# MoveIt-lite motion mode for the FRANKA RESEARCH 3.
#
# Peer of motion.yaml. It is a separate file rather than a shared one because
# every number in the controller block is an arm hardware fact, and the two arms
# do not share units: the DM table is MIT-wire-format kp (ceiling 500) closed by
# the motor firmware, the FR3 wants joint stiffness in N·m/rad closed by
# libfranka's internal impedance controller. One table cannot serve both, and a
# mode config keyed by the wrong joint names expands to ZERO gains.
#
# planner.joints is deliberately absent — it defaults to `arm.joints` from the
# arm config, which is the canonical answer for whichever arm is loaded.
include: [../../robots/fr3/control_mode.yaml]   # controller ceilings and gain presets, shared with real FR3 modes

plant:
  mode: command
  listen_mode: false

controller:
  # Runtime guards belong in the deployment config's execution_policy block.
  # Joint stiffness (N·m/rad). Matches arm.kp in the FR3 calibration.yaml —
  # consumed by the SIM plant's PD (the real position path was removed;
  # torque control lives on the RT machine).
  kp:
    fr3_joint1: 1200.0
    fr3_joint2: 1200.0
    fr3_joint3: 1200.0
    fr3_joint4: 1200.0
    fr3_joint5: 800.0
    fr3_joint6: 600.0
    fr3_joint7: 400.0
  # kd is deliberately ABSENT: it falls back to arm.kd in the ARM config. The
  # base calibration carries kd = 0 (no host loop over the real arm), and in
  # SIM the MuJoCo plant closes an explicit PD law where kd = 0 means NO
  # damping — kp = 1200 rings forever (measured: ~10 Hz constant-amplitude
  # oscillation on joints 1-3). configs/entries/sim_franka.yaml overrides arm.kd.
  # Bounds the executor's tau_ff (sim-only on this arm). Kept truthful to
  # the datasheet so the numbers still mean something.
  # torque_limits deliberately ABSENT: these were the URDF's `effort`
  # restated (87/12), and the FR3's torque limit is a FACTORY fact, not
  # a mode choice. resolve_gains falls back to `arm.max_tau`, which the
  # robot config states once; add_contracts asserts that value against
  # the description. A profile states torque limits only to run an arm
  # BELOW its rating -- an operating cap, which this was not.

# Planner (OMPL RRT-Connect over joint space + MuJoCo self-collision oracle): nothing to state.
# vel_limits / acc_limits deliberately ABSENT: the planner times plans at the FR3 execution policy's limits
# (robots/fr3/execution.yaml), the single statement; state lower ones under `planner:` only to plan slower. OMPL settings: the code
# defaults (arm_control.planning.PLANNER_DEFAULTS); state one only to deviate.

# See motion.yaml: the panel address moved to the robot config's
# `console.http_port`, which is what actually keeps two arms apart.

# --- Jog envelope -----------------------------------------------------------
# Everything not stated here takes the conservative code default in
# `arm_control/planning/jog.py` (1 cm/s, 20 cm stroke, floor at z=0).
jog:
  # sigma_min is ARM-SPECIFIC and must not be inherited. Measured on this
  # URDF (6000 poses sampled uniformly over the joint limits, translational
  # rows only): median 0.217, p1 0.030, p0.1 0.008, worst 0.003. Named poses:
  # 0.29 at the demo spawn, 0.35 elbow-bent, 0.13 fully extended. 0.03 is the
  # 1st percentile -- it refuses the worst ~1% of the workspace and leaves the
  # whole useful envelope open. (The DM assembler's 0.02 is NOT this number:
  # that arm reads ~0.049 extended, so the same threshold means something far
  # tighter there. Re-measure per arm; do not copy.)
  sigma_min: 0.03

# Gain presets: robots/fr3/control_mode.yaml.
