# Generic FR3 model profile for the standalone simulation example.
# No deployed addresses, camera roles, workcell calibration, or task geometry.
# Stage a stock franka_description under the selected ARM_CONTROL_ROOT first.
include:
  - ../../robots/fr3/description.yaml   # the FR3's own facts (joints, frames, URDF, torque ratings): stated once there
  - ../../robots/fr3/gains.yaml         # its default stiffness/damping

# Example-only: an arm at the world origin, not a deployed bench (the deployed placement lives with the project's workcell).
arm:
  world_origin: [0.0, 0.0, 0.0]
  world_rpy: [0.0, 0.0, 0.0]
# The simulation node uses this to initialize finger opening.
franka:
  gripper:
    open_width_m: 0.075
viz_publish_rate_hz: 60
rerun_fk_rate_hz: 30
rerun_plot_window_s: 10.0
viz_log_rates: false
