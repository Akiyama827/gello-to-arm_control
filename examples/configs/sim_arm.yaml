# The operator console against a simulated FR3 — the one runnable example.
#
# THIS FILE IS AN EXCEPTION to the rule stated in the README: runnable ENTRY
# configs belong with the deployment, because a deployment owns the CAD, the
# scenario and the measured extrinsics, and this repo owns none of those. The
# exception is narrow and deliberate: without ONE entry that runs, "arm-agnostic
# library" is a claim nobody can check, and a new consumer has nothing to copy.
# `configs/entry/` is examples only. A real robot's entry config still lives
# with the project that owns its CAD.
#
# Assets: this repo vendors no meshes. Stage the FR3 description once --
#
#     python scripts/setup_fr3_assets.py --source <franka_description checkout>
#     # git clone https://github.com/frankarobotics/franka_description
#
# then run it:
#
#     python scripts/run_console.py
#
# A neutral standalone example: origin at zero, no deployed bench collision
# table. The previous concrete bench example is preserved by the consuming
# project as configs/entries/sim_console_demo.yaml, with its original values.
include:
  - franka.yaml

# --- Plant: MuJoCo, no libfranka, no FCI, no RT box -------------------------
# WHICH plant runs is the GRAPH's choice, not a key here: sim_franka_motion.yml
# names nodes/mujoco_interface.py, and that is the whole switch. (Three keys
# used to sit here pretending otherwise -- `real_backend: mujoco`,
# `sim_backend: mujoco`, `listen_mode: true`. Nothing in this graph read any
# of them, and `real_backend` is worse than inert: on a HARDWARE graph it
# names the SocketCAN interface to open, so "mujoco" was an instruction to
# open a CAN device by that name. `scripts/run_console.py --self-check` now
# refuses an entry key no code reads.)
sim_model_path: franka/urdf/fr3.urdf
sim_update_rate_hz: 100
sim_timestep: 0.001
sim_launch_viewer: false
sim_self_collision: true
update_rate_hz: 100

# --- Damping: the sim plant needs what the real arm never reads -------------
# The MuJoCo plant closes an explicit PD law every 1 ms, where kd = 0 means NO
# damping and the arm never settles. The real FR3's calibration carries kd
# zeros because no host process closes a loop over it (torque control lives on
# the RT machine), so the sim plant has to supply its own -- and calibration.yaml
# says so in as many words: "kd 0 rings forever in sim ... that override and
# this line are a pair."
#
# MEASURED on this model (hold at the home pose with gravity feedforward,
# settled max |qd| over the last 40% of a 4 s run):
#
#   kd            settled max|qd|   pos err
#   0                83.8 rad/s     0.734 rad   <- unusable
#   kp/20             0.87           0.0136
#   kp/30..kp/60      0.0000         0.00098    <- flat, settled plateau
#   kp/16             0.93           0.0230     <- MORE damping is WORSE here
#
# kp/40 sits mid-plateau. Past ~kp/20 extra damping degrades settling, so do
# not "add more kd" if the sim looks lively -- re-run the sweep.
#
# Deep merge: only `kd` is overridden; the rest of `arm:` inherits.
arm:
  kd: [30, 30, 30, 30, 20, 15, 10]

# --- Spawn state ------------------------------------------------------------
# The Franka ready pose, the same one the scenario configs spawn at. Without
# it the plant starts at MuJoCo's implicit zero, which is OUTSIDE joint4's
# limit, and the arm settles onto its stops before anyone presses ARM.
sim_default_joint_positions:
  fr3_joint2: -0.785
  fr3_joint4: -2.356
  fr3_joint6: 1.571
  fr3_joint7: 0.785

# The FR3's control box holds the arm up whether or not a host is streaming.
# Without this the demo comes up DISARMED (by design — nothing moves without
# an operator) and quietly sags out of the pose above while you read the page.
sim_gravcomp: true

rerun_app_id: arm_control_sim_demo
motor_log_path: /tmp/arm_control_sim_demo.csv

# Per-INSTANCE, which is why it is here and not in a mode config.
console:
  http_port: 7500
  http_bind: 127.0.0.1
