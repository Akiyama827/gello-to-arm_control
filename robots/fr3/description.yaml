# Franka Research 3: the robot MODEL's own facts, stated once for every config that drives an FR3 (the library examples and the
# project's robots/franka/). Vendor facts only: joint and finger names in order, the TCP frame, the description to load, the factory
# torque ratings (the URDF `effort` values; add_contracts asserts them against the description). No addresses, calibration, scene or
# operating choice belongs here: those have their own homes (deployment registry, model bundles, workcells, control profiles).
arm:
  joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
  gripper_joints: [fr3_finger_joint1, fr3_finger_joint2]
  ee_frame: fr3_hand_tcp
  urdf: franka/urdf/fr3.urdf
  max_tau: [87, 87, 87, 87, 12, 12, 12]
num_motors: 7
motor_ids: [1, 2, 3, 4, 5, 6, 7]
motor_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
render_joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
urdf_path: franka/urdf/fr3.urdf
gripper_range_m: [0.0, 0.04]
