# Sim twin of real_motion.yml: the DM arm through its SUPERVISOR over a simulated MuJoCo plant (CTRL-053), as
# sim_franka_motion.yml does for the FR3.
#
# The supervisor is the control authority: a separate process (`--plant sim`) running the arm's controller under its
# execution_policy, started before this graph by the launcher (python tools/run.py sim motion). Nodes reach it only through
# the SDK: `supervised_arm` serves the arm_controller contract. The gripper is driven by `franka_gripper` (the hand_bridge
# client) over the Hand protocol, against the sim Hand the supervisor serves at rt.host:rt.hand_port with the DM gripper's
# envelope (sim_hand.limits: no force grasp, so GRASP is refused) and finger map (joint_mimics) -- the wire the DM gripper's
# hand_bridge --backend dm speaks on the bench.
#
# ONE command owner: the console plans, the supervisor servos; a plan runs only when an `execute` names its id. Jog is a
# supervisor setpoint (setpoint/1); gains must be named presets (control mode `gain_presets`).
#
#   python tools/run.py sim motion
nodes:
  - id: arm_console
    path: ../nodes/arm_console.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      controller_event: supervised_arm/controller_event
      # the console takes its armed state and its fault latch from motor_health alone (it needs exactly ONE authority source)
      motor_health: supervised_arm/motor_health
      plant_capabilities: supervised_arm/model_revision
      gripper_state: franka_gripper/gripper_state
      grasp_result: franka_gripper/grasp_result
    outputs:
      - plan       # gated, named
      - control    # arm / execute / cancel / gains
      - jog        # live setpoint while a direction is held
      - gripper
      - grasp_request

  - id: franka_gripper
    path: ../nodes/franka_gripper.py
    inputs:
      gripper: arm_console/gripper
      grasp_request: arm_console/grasp_request
    outputs:
      - gripper_state
      - grasp_result

  - id: supervised_arm
    path: ../nodes/supervised_arm.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion.yaml
    inputs:
      plan:     arm_console/plan
      control:  arm_console/control
      jog:      arm_console/jog
    outputs:
      - motor_state
      - arm
      - controller_event
      - motor_health
      - model_revision

  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: supervised_arm/motor_state
      gripper_state: franka_gripper/gripper_state
