# Sim twin of real_motion.yml: HTTP-panel teleop -> planner -> trajectory executor
# -> MuJoCo sim plant. Desk-side end-to-end check of the motion stack with zero
# hardware: same nodes, same mode config, mujoco_interface instead of the DM
# bridge (no operator arm gate / safety layer — the sim plant applies commands
# directly).
#
#   ARM_CONTROL_CONFIG=configs/sim_assembler.yaml dora run dataflows/sim_motion.yml
#   (or: python scripts/view.py sim motion)
nodes:
  - id: motion_teleop
    path: ../nodes/motion_teleop.py
    env:
      ARM_CONTROL_MODE_CONFIG: configs/modes/motion.yaml
    inputs:
      motor_state: plant_interface/motor_state
    outputs:
      - trajectory
      - gripper

  - id: trajectory_executor
    path: ../nodes/trajectory_executor.py
    env:
      ARM_CONTROL_MODE_CONFIG: configs/modes/motion.yaml
    inputs:
      motor_state: plant_interface/motor_state
      trajectory:  motion_teleop/trajectory
    outputs:
      - motor_command

  - id: plant_interface
    path: ../nodes/mujoco_interface.py
    inputs:
      motor_command: trajectory_executor/motor_command
      # Teleop gripper slider drives the scene's finger servos directly (the
      # 6-motor sim config has no gripper motor slot). No-op if the scene has
      # no gripper.
      motor_command_gripper: motion_teleop/gripper
    outputs:
      - motor_state
      - sim_qpos       # live twin qpos (unconsumed here)
      - gripper_state  # finger positions/efforts (unconsumed here)
      - topology_state # sent once with model_revision (unconsumed here)
      - model_revision

  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: plant_interface/motor_state
