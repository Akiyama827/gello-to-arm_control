# REAL FR3 motion through the arm's SUPERVISOR (CTRL-053) and the RT machine.
#
# The control authority is the arm's supervisor, a separate process the launcher starts first
# (`python -m arm_control.supervisor.service --config <merged> --plant rt`), connected to arm_rt_server on the RT box
# (--backend franka): it runs the controller (100 Hz servo words: q_des, qd_des, tau_ff MINUS gravity, kp, kd; the 1 kHz torque
# loop, clamp, slew, staleness->hold and fault latching live server-side). Nodes reach it only through the SDK: `supervised_arm`
# serves the arm_controller contract. Two motion sources feed it:
#   - arm_console: sliders -> OMPL plan (MuJoCo self-collision oracle) -> preview -> Execute (point-to-point, planned); jog is a
#     supervisor setpoint (setpoint/1), saturated at the execution policy's velocity/acceleration limits
#   - trajectory_replay: drag-teach playback of an rt_handguide recording (echo <csv> > /tmp/arm_replay_go)
# The motor CSV (rung 3: tracking error = qdes - pos) is written from the supervisor's trace/1 by `trace_logger`, same columns.
#
# SAFETY — the graph comes up DISARMED (the supervisor never ARMs on its own). The console page carries the operator gate
# (ARM/DISARM + armed badge; DISARM is one click). The RT server must be up with the franka backend and its NORMAL deadman
# (default --fault-ms 1000, NOT the handguide's 3600000 -- losing the commander must park the arm). Soft is offered when the RT
# server runs pose hold.
#
#   python tools/run.py real franka motion        # the project launcher (starts the supervisor, then this graph's twin)
nodes:
  - id: arm_console
    path: ../nodes/arm_console.py
    env:
      ARM_CONTROL_MODE_CONFIG: configs/modes/franka_rt.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      motor_health: supervised_arm/motor_health
      controller_event: supervised_arm/controller_event
      plant_capabilities: supervised_arm/model_revision
      # Live Hand width -> the measured ghost's fingers track reality.
      gripper_state: franka_gripper/gripper_state
      grasp_result: franka_gripper/grasp_result
    outputs:
      - plan
      - control
      - jog
      - gripper
      - grasp_request
      - hand_home

  # The Franka Hand — its own TCP service on the RT box (hand_bridge), beside the arm's.
  - id: franka_gripper
    path: ../nodes/franka_gripper.py
    inputs:
      gripper: arm_console/gripper
      grasp_request: arm_console/grasp_request
      hand_home: arm_console/hand_home
    outputs:
      - gripper_state
      - grasp_result

  - id: trajectory_replay
    path: ../nodes/trajectory_replay.py
    env:
      ARM_CONTROL_MODE_CONFIG: configs/modes/franka_rt.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      # Replay is a second motion-authority path (file trigger, no page in
      # front of it): it refuses while DISARMED or fault-latched.
      motor_health: supervised_arm/motor_health
    outputs:
      - plan
      - control

  # The arm_controller contract from the arm's supervisor (the only control authority).
  - id: supervised_arm
    path: ../nodes/supervised_arm.py
    env:
      ARM_CONTROL_MODE_CONFIG: configs/modes/franka_rt.yaml
    inputs:
      plan:     arm_console/plan
      control:  arm_console/control
      jog:      arm_console/jog
      plan_replay:    trajectory_replay/plan
      control_replay: trajectory_replay/control
    outputs:
      - motor_state
      - arm
      - controller_event
      - motor_health
      - model_revision

  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: supervised_arm/motor_state
      gripper_state: franka_gripper/gripper_state

  # Tracking log from the supervisor's trace/1: measured pos/vel/torque, the PC's q_des, the RT's servoed command -> CSV.
  - id: motor_state_logger
    path: ../nodes/trace_logger.py
    inputs:
      tick: dora/timer/millis/100
