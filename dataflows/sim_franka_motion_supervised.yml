# Sim twin of real_franka_motion.yml with the arm's SUPERVISOR as the control authority (graph migration pilot, CTRL-053).
#
# Same console, same contract: the in-process `arm_controller` node and the `mujoco_interface` plant node are replaced by ONE
# `supervised_arm` node that serves the arm_controller contract (plan/control in; controller_event/arm/motor_state/model_revision out)
# from the arm's supervisor, which runs the same controller over a simulated MuJoCo plant (`--plant sim`). The supervisor is a
# separate process; `python examples/run_console.py --supervised` starts it and this graph together. The node refuses to start
# against a supervisor running a different configuration.
#
# Differences the console shows: jog is a supervisor setpoint (setpoint/1; it cancels a staged plan first); no gripper through the
# supervisor (refused with a notice); gains must be named presets (control mode `gain_presets`).
#
#   python examples/run_console.py --supervised
nodes:
  - id: arm_console
    path: ../nodes/arm_console.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      controller_event: supervised_arm/controller_event
      # the console takes its armed state and its fault latch from motor_health alone (it needs exactly ONE authority source)
      motor_health: supervised_arm/motor_health
      plant_capabilities: supervised_arm/model_revision
    outputs:
      - plan
      - control
      - jog
      - gripper

  # Drag-teach replay driver (file-triggered, inert otherwise).
  - id: trajectory_replay
    path: ../nodes/trajectory_replay.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      motor_state: supervised_arm/motor_state
    outputs:
      - plan
      - control

  - id: supervised_arm
    path: ../nodes/supervised_arm.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      plan:     arm_console/plan
      control:  arm_console/control
      jog:      arm_console/jog
      gripper:  arm_console/gripper
      plan_replay:    trajectory_replay/plan
      control_replay: trajectory_replay/control
    outputs:
      - motor_state
      - arm
      - controller_event
      - motor_health
      - model_revision
