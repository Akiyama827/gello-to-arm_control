# READ-ONLY monitor graph for the FRANKA RESEARCH 3.
#
# NO MOTION FROM THIS GRAPH (user decision 2026-07-26): the FR3 runs torque
# control only, and the torque servo lives on the realtime machine. This graph
# is the arm's host-side presence — live state into the visualizer, health and
# fault reporting, gripper via grasp_request if an orchestrator is wired, and
# the arm gate (which on this arm only gates gripper actions and clears
# latched reflexes; nothing here can move the robot).
#
# Sim motion is unchanged: `python tools/run.py sim franka motion` runs the
# full teleop/planner/executor stack against the MuJoCo plant.
#
# Prerequisites: FR3 unlocked in Desk with FCI active, pylibfranka importable
# from conda BASE.
#
#   ARM_CONTROL_CONFIG=configs/entries/real_franka.yaml dora run dataflows/real_franka_listen.yml
#   (or: python tools/run.py real franka listen)
nodes:
  - id: operator_arm
    path: ../nodes/operator_arm.py
    outputs:
      - arm

  - id: plant_interface
    path: ../nodes/franka_interface.py
    inputs:
      arm: operator_arm/arm
    outputs:
      - motor_state
      - motor_state_viz
      - motor_health
      - gripper_state
      - model_revision

  # No can_bus_status input: there is no CAN bus on this arm. Packet health
  # rides motor_health.success_rate (libfranka's control_command_success_rate),
  # which is the FR3's equivalent early warning.
  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: plant_interface/motor_state_viz

  # Tracking log: measured pos/vel/torque per motor_state tick -> CSV
  # (motor_log_path). With no host-side commands, q_des echoes the RT side's
  # target once that loop exists.
  - id: motor_state_logger
    path: ../nodes/motor_state_logger.py
    inputs:
      motor_state: plant_interface/motor_state
