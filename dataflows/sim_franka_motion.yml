# Sim twin of real_franka_motion.yml: the FR3 through the arm's SUPERVISOR over a simulated MuJoCo plant (CTRL-053).
#
# The supervisor is the control authority, as on the bench: a separate process (`--plant sim`) running the same controller,
# started with this graph by `python examples/run_console.py` (or a project launcher). Nodes reach it only through the SDK:
# `supervised_arm` serves the arm_controller contract (plan/control/jog in; controller_event/arm/motor_state/motor_health/
# model_revision out), and the Franka Hand is driven by `franka_gripper` over its own protocol, exactly as on the bench, against
# the sim Hand the supervisor serves at rt.host:rt.hand_port (examples/profiles/sim_supervised.yaml). The node refuses to start
# against a supervisor running a different configuration.
#
# What the console sees differently from the retired in-process path: jog is a supervisor setpoint (setpoint/1; it cancels a
# staged plan first); gains must be named presets (control mode `gain_presets`).
#
#   python examples/run_console.py
nodes:
  - id: arm_console
    path: ../nodes/arm_console.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      controller_event: supervised_arm/controller_event
      # the console takes its armed state and its fault latch from motor_health alone (it needs exactly ONE authority source)
      motor_health: supervised_arm/motor_health
      plant_capabilities: supervised_arm/model_revision
      gripper_state: franka_gripper/gripper_state
      grasp_result: franka_gripper/grasp_result
    outputs:
      - plan
      - control
      - jog
      - gripper
      - grasp_request

  # The Franka Hand over its own protocol (the sim Hand here, the RT box's hand_bridge on the bench).
  - id: franka_gripper
    path: ../nodes/franka_gripper.py
    inputs:
      gripper: arm_console/gripper
      grasp_request: arm_console/grasp_request
    outputs:
      - gripper_state
      - grasp_result

  # Drag-teach replay driver (file-triggered, inert otherwise): validates a
  # real hand-guided recording against the MuJoCo twin before bench day.
  #   echo float.csv > /tmp/arm_replay_go
  - id: trajectory_replay
    path: ../nodes/trajectory_replay.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      motor_health: supervised_arm/motor_health
    outputs:
      - plan
      - control

  - id: supervised_arm
    path: ../nodes/supervised_arm.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion_franka.yaml
    inputs:
      plan:     arm_console/plan
      control:  arm_console/control
      jog:      arm_console/jog
      plan_replay:    trajectory_replay/plan
      control_replay: trajectory_replay/control
    outputs:
      - motor_state
      - arm
      - controller_event
      - motor_health
      - model_revision

  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: supervised_arm/motor_state
      gripper_state: franka_gripper/gripper_state
