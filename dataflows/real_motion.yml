# REAL DM arm motion through the arm's SUPERVISOR (CTRL-053) and the RT machine -- the DM twin of real_franka_motion.yml.
#
# The control authority is the arm's supervisor, a separate process the launcher starts first, connected to arm_rt_server on the
# RT box (--backend dm: the DM arm's joints 1-6 on the box's CAN bus; the 500 Hz servo, clamp, staleness->hold and fault
# latching live server-side). The supervisor runs the controller under the arm's execution_policy. Nodes reach it only through
# the SDK: `supervised_arm` serves the arm_controller contract. The gripper (motor 7) is its own device behind hand_bridge
# --backend dm on the box (rt.host:rt.hand_port), driven by `franka_gripper` over the Hand protocol: MOVE/HOME/GSTOP; GRASP is
# refused until its force map is measured. The motor CSV is written from the supervisor's trace/1 by `trace_logger`.
#
# SAFETY -- the graph comes up DISARMED (the supervisor never ARMs on its own). The console page carries the operator gate
# (ARM/DISARM + armed badge; DISARM is one click). A joint resting past its URDF limit when ARMed is held where it rests and can
# only be brought back in (never further out). The DM arm shares can0 with the base: ONE robot powered at a time (the server
# refuses to start or run beside the other).
#
#   python tools/run.py real motion        # the project launcher (stages the registry instance, starts the supervisor)
nodes:
  - id: arm_console
    path: ../nodes/arm_console.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion.yaml
    inputs:
      motor_state: supervised_arm/motor_state
      motor_health: supervised_arm/motor_health
      controller_event: supervised_arm/controller_event
      plant_capabilities: supervised_arm/model_revision
      gripper_state: franka_gripper/gripper_state
      grasp_result: franka_gripper/grasp_result
    outputs:
      - plan
      - control
      - jog
      - gripper
      - grasp_request

  - id: franka_gripper
    path: ../nodes/franka_gripper.py
    inputs:
      gripper: arm_console/gripper
      grasp_request: arm_console/grasp_request
    outputs:
      - gripper_state
      - grasp_result

  - id: supervised_arm
    path: ../nodes/supervised_arm.py
    env:
      ARM_CONTROL_MODE_CONFIG: examples/profiles/motion.yaml
    inputs:
      plan:     arm_console/plan
      control:  arm_console/control
      jog:      arm_console/jog
    outputs:
      - motor_state
      - arm
      - controller_event
      - motor_health
      - model_revision

  - id: visualizer
    path: ../nodes/visualizer.py
    inputs:
      motor_state: supervised_arm/motor_state
      gripper_state: franka_gripper/gripper_state

  # The tracking CSV from the supervisor's trace/1 (measured and commanded per controller tick).
  - id: motor_state_logger
    path: ../nodes/trace_logger.py
    inputs:
      tick: dora/timer/millis/100
